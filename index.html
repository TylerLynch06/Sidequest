<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sidequest — chart new lands between stops</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <!-- Other CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Sidequest</h1>
        <p class="tagline">Ride the bus. Hop off. Chart new lands.</p>
    </header>

    <main>

        <div class="route-form">
            <input
                type="text"
                id="origin"
                placeholder="Where does the journey begin?"
                autocomplete="off"
            >

            <input
                type="text"
                id="destination"
                placeholder="Where are you headed?"
                autocomplete="off"
            >

            <button id="route-button">Find sidequests</button>
        </div>

        <!-- Leaflet will insert the map into this element -->
        <div id="map"></div>


        <!-- Shown while landmarks are being fetched (see landmarks.js) -->
        <div id="scout-toast" role="status" aria-live="polite">
            <span class="scout-marks" aria-hidden="true">
                <svg viewBox="0 0 30 30"><path d="M6 5 L24 25 M24 5 L6 25"/></svg>
                <svg viewBox="0 0 30 30"><path d="M6 5 L24 25 M24 5 L6 25"/></svg>
                <svg viewBox="0 0 30 30"><path d="M6 5 L24 25 M24 5 L6 25"/></svg>
            </span>
            <span class="scout-text">Scouting for landmarks…</span>
        </div>

        <!-- Side quest plan (filled in by js/sidequest.js) -->
        <aside id="quest-panel"></aside>

    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/map.js"></script>
    <script src="js/landmarks.js"></script>
    <script src="js/sidequest.js"></script>

</body>
</html>
